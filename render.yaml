services:
  - type: web
    name: speed-quiz-show
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.22.0
      - key: UPLOAD_DIR
        value: /tmp/speed-quiz-show/uploads
      - key: DATA_DIR
        value: /tmp/speed-quiz-show/data
